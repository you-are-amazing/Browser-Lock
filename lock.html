<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Locked</title>
  <style>
    :root {
      --bg-black: #000000;
      --bg-gradient: radial-gradient(circle at center, #111111 0%, #050505 55%, #000000 100%);
      --card-bg: #0a0a0a;
      --card-border: #222222;
      --input-bg: #121212;
      --input-border: #2a2a2a;
      --accent: #ffffff;
      --accent-hover: #e5e5e5;
      --accent-text: #000000;
      --danger: #ef4444;
      --success: #22c55e;
      --text-main: #f5f5f5;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-black);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      overflow: hidden;
      padding: 1rem;
    }

    /* Subtle carbon ambient glow */
    .glow {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .lock-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2.25rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .lock-card.shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .icon-wrapper {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      background: #141414;
      border: 1px solid #2e2e2e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.65rem;
      line-height: 1.45;
    }

    .input-group {
      position: relative;
      margin-bottom: 0.9rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #a3a3a3;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-box {
      position: relative;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.88rem 2.8rem 0.88rem 1rem;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input:focus {
      border-color: #ffffff;
      background: #161616;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
    }

    .toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .toggle-btn:hover {
      color: #ffffff;
    }

    .primary-btn {
      width: 100%;
      padding: 0.9rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.25rem;
    }

    .primary-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .primary-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .primary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary-btn {
      margin-top: 0.85rem;
      background: transparent;
      border: 1px solid #262626;
      color: #b3b3b3;
      width: 100%;
      padding: 0.72rem;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .secondary-btn:hover {
      background: #171717;
      color: #ffffff;
      border-color: #3a3a3a;
    }

    .status-msg {
      min-height: 20px;
      margin-top: 0.9rem;
      font-size: 0.84rem;
      color: var(--danger);
      font-weight: 500;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      margin-top: 1.4rem;
      padding-top: 1rem;
      border-top: 1px solid #1c1c1c;
      font-size: 0.76rem;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="lock-card" id="lockCard">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <!-- VIEW 1: UNLOCK VIEW -->
    <div id="unlockView">
      <h1>Browser Locked</h1>
      <p class="subtitle">Enter your master password to unlock your session and restore your tabs.</p>

      <form id="unlockForm">
        <div class="input-group">
          <div class="input-box">
            <input
              type="password"
              id="passwordInput"
              placeholder="Enter master password"
              autocomplete="current-password"
              autofocus
              required
            />
            <button type="button" class="toggle-btn" id="togglePassword" title="Show/Hide Password">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="primary-btn" id="unlockBtn">Unlock Browser</button>
        <button type="button" class="secondary-btn" id="showChangePassBtn">Change Password</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <!-- VIEW 2: CHANGE PASSWORD VIEW (Directly inside Browser Locked Page) -->
    <div id="changePassView" class="hidden">
      <h1>Change Password</h1>
      <p class="subtitle">Verify your current password to set a new master password.</p>

      <form id="changePassForm">
        <div class="input-group">
          <label for="oldPassInput">Current Password</label>
          <div class="input-box">
            <input
              type="password"
              id="oldPassInput"
              placeholder="Enter current password"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label for="newPassInput">New Password</label>
          <div class="input-box">
            <input
              type="password"
              id="newPassInput"
              placeholder="At least 4 characters"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassInput">Confirm New Password</label>
          <div class="input-box">
            <input
              type="password"
              id="confirmPassInput"
              placeholder="Re-enter new password"
              required
            />
          </div>
        </div>

        <button type="submit" class="primary-btn" id="savePassBtn">Update Password</button>
        <button type="button" class="secondary-btn" id="backToUnlockBtn">Back to Unlock</button>
        <div class="status-msg" id="changePassMsg"></div>
      </form>
    </div>

    <div class="footer-note">
      Account data &amp; active sessions are safely preserved.
    </div>
  </main>

  <script type="module" src="lock.js"></script>
</body>
</html>
